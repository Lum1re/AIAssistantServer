spring.data.redis.port=6379

# ===== Agent 编排 =====
# orchestrated：先识别意图，再由代码按意图分发（默认）
# legacy：改造前的行为，全部交给大模型自由调用工具
ai.agent.mode=orchestrated
# 意图识别超时（毫秒）。LLM 首字延迟经常 1~3 秒，网络差会更久，
# 不要设太小，否则每次都超时降级。超时按 UNKNOWN 处理，降级到原链路。
ai.agent.intent.timeout-ms=10000
# 置信度低于这个值就按 UNKNOWN 处理
ai.agent.intent.min-confidence=0.6

# 会话状态的过期时间（分钟）。用户这么久没说话，未完成的任务自动作废。
ai.agent.state-ttl-minutes=30

# 用户级并发锁的兜底过期时间（秒）。正常路径处理完就释放，这个只是防进程崩溃卡死。
ai.agent.lock-ttl-seconds=15

# 确认票据的有效期（分钟）。用户在"确认退款/下单"这一步停留太久，数据可能已变。
ai.agent.confirm-ttl-minutes=5

