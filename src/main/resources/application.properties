# 密钥不放文件里！从环境变量 DASHSCOPE_API_KEY 读（冒号后面是"没设置时"的默认值，留空）
langchain4j.open-ai.streaming-chat-model.api-key=${DASHSCOPE_API_KEY:sk-ws-H.PYXPMRM.1l7B.MEUCIGdbzmoPSSeQ9VsSEEcj_FT23ZIrgToZ8HOuAGQl6c99AiEAklEBPK4wBWJmky0bvhiO9t0qIxIiqt11XAMLT2nxvD0}
