# ============================================================
# 本地开发专用配置
# ------------------------------------------------------------
# 激活方式（三选一）：
#   1. IDEA：Run Configuration → Active profiles 填 dev
#   2. 命令行：mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   3. 启动参数：--spring.profiles.active=dev
#
# ⚠️ 不激活时本文件完全不生效。
# ⚠️ 这里的配置会完整打印用户对话原文（含订单号、金额、手机号），
#    只允许本地开发使用，生产环境绝对不要激活 dev profile。
# ============================================================

# 打印发给模型的完整请求 + 模型返回的完整响应。
# 注意前缀必须是 streaming-chat-model：本项目用的是流式模型，
# 写 chat-model.* 是无效的（那是非流式模型的开关，那个 bean 根本没被创建）。
langchain4j.open-ai.streaming-chat-model.log-requests=true
langchain4j.open-ai.streaming-chat-model.log-responses=true

# 我们自己的代码打 DEBUG 日志：
#   - IntentRecognizer：首字延迟、超时详情
#   - AgentOrchestrator：意图识别结果、分发去向、降级原因
logging.level.secKillAI=DEBUG
